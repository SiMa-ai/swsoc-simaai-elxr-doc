[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cib"
version = "0.1.0"
description = "SiMa.ai Customer Image Builder CLI"
requires-python = ">=3.9"
# PyYAML comes from Debian's python3-yaml in the CIB image.
dependencies = []

[project.scripts]
cib = "cib.cli:main"

[tool.setuptools]
packages = ["cib"]
