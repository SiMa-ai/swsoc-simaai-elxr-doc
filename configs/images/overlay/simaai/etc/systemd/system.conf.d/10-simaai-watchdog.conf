# The boot watchdog is armed by tRoot, serviced by U-Boot and handed to the
# kernel running; the kernel keeps it fed only until userspace takes over
# (bounded by watchdog.open_timeout on the command line). This makes systemd
# that userspace: PID 1 opens /dev/watchdog0 as soon as it starts and feeds
# it from then on, so a healthy boot is never reset - while a boot that hangs
# before systemd starts is, and counts toward the A/B rollback.
# As a side effect a hard runtime hang of PID 1 also resets the board.
[Manager]
RuntimeWatchdogSec=30s
